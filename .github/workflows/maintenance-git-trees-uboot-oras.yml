name: "Maintenance: Generate u-boot git tree"

on:
  schedule:
    - cron: '0 3 * * *' # Scheduled runs every day at 3am UTC; two hours after the kernel job, which is long
  workflow_dispatch:

# The kernel workflow has no concurrency group, but this one publishes to a single :latest tag
# and a manual dispatch during the nightly should queue behind it rather than race it.
concurrency:
  group: uboot-git-trees-${{ github.ref }}
  cancel-in-progress: false

jobs:

  git-trees-uboot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: write
    steps:

      # Note: no "Free Github Runner" step here, unlike the kernel workflow. That action costs a
      # few minutes; this job needs roughly 1.5 GiB (tree + repack scratch + tar) and a stock
      # runner has ~25 GiB free. The df below is there to notice if that ever stops being true.

      - name: Docker Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # GitHub username or org
          password: ${{ secrets.GITHUB_TOKEN }}    # GitHub actions builtin token. repo has to have pkg access.

      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep alive
        uses: liskin/gh-workflow-keepalive@v1

      # Canary: prove the login/token/packages permission works before spending the whole job on
      # a tree we would then fail to publish. Its own package name, so it does not collide with
      # the kernel workflow's canary.
      - name: Test ORAS, Tokens, Logins, etc
        env:
          TARGET_OCI: "ghcr.io/${{ github.repository }}/u-boot-git-oras-validation:latest"
          TARGET_FULL_FILE_PATH: "/tmp/test_oras/test.txt"
        run: |
          mkdir -p "/tmp/test_oras"
          date > "${TARGET_FULL_FILE_PATH}"
          bash oras_upload.sh

      - name: Show disk space
        run: df -h

      # Deliberately no actions/cache here, unlike the kernel workflow. The GHA cache budget is
      # 10 GiB per *repository* and LRU-evicted; the kernel worktree entry is the expensive one to
      # lose (re-downloading kernel.org's clone.bundle and re-resolving deltas), and a u-boot entry
      # would evict it to save a few minutes of HTTPS clone. Always starting cold also keeps the
      # single-packfile and no-stale-refs properties honest -- a cached tree would hold onto
      # branches from an EXTRA_TREES entry long after that entry was removed.
      - name: Prepare u-boot git tree
        run: |
          BASE_WORK_DIR="/tmp/workdir" bash work_uboot_tree.sh

      - name: Upload combined u-boot tree to ghcr.io via ORAS
        env:
          TARGET_OCI: "ghcr.io/${{ github.repository }}/u-boot-git:latest"
          TARGET_FULL_FILE_PATH: "/tmp/workdir/u-boot/output_oras/u-boot-complete.git.tar"
        run: |
          bash oras_upload.sh
